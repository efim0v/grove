name: Site

# Grove is now part of Brow, so every page in site/, 404.html included, must
# send its visitor to the same path under efimov.page/brow/: a 0-second refresh,
# a canonical and a location.replace (keeping the #fragment) to that target, a
# link to it on the page, lang, no robots directive against it, no hreflang, and
# no sitemap entry. Scripts/check_seo.py still checks a real page in full.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "Scripts/check_seo.py"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "Scripts/check_seo.py"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check the site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check that every page leads to its Brow counterpart
        run: python3 Scripts/check_seo.py site https://efimov.page/grove/ https://efimov.page/brow/
