name: Pages

# Publishes site/ to https://efimov.page/grove/. The repository's Pages
# source must be set to "GitHub Actions" (Settings → Pages).
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A queued run waits for the one in progress instead
# of cancelling it, so a deployment is never cut off halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The whole history, so the IndexNow step can diff against the last push.
          fetch-depth: 0

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5

      # Sends only the HTML pages this push changed (all of them on a manual run),
      # deleted ones included. 404.html and verification files are skipped.
      - name: Tell IndexNow which pages changed
        # Bing, Yandex and the other IndexNow engines. Google does not take part in IndexNow.
        if: success()
        continue-on-error: true
        env:
          KEY: 936194525e90ed123a03aad1d30dc935   # public by design; same value as site/<KEY>.txt
          BASE: https://efimov.page/grove/
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE" HEAD -- 'site/*.html')
          else
            files=$(git ls-files -- 'site/*.html')
          fi
          urls=""
          for f in $files; do
            case "$f" in site/404.html|site/google*.html|site/yandex_*.html) continue ;; esac
            path=${f#site/}
            path=${path%index.html}
            urls="$urls\"$BASE$path\","
          done
          if [ -z "$urls" ]; then
            echo "No page changed; nothing to send."
            exit 0
          fi
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$BASE$KEY.txt")" = 200 ] && break
            sleep 10
          done
          body="{\"host\":\"efimov.page\",\"key\":\"$KEY\",\"keyLocation\":\"$BASE$KEY.txt\",\"urlList\":[${urls%,}]}"
          echo "$body"
          curl -sS -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$body" -o /dev/null -w 'IndexNow: HTTP %{http_code}\n'
